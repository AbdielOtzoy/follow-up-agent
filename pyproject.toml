[project]
name = "follow-up-agent"
version = "0.1.0"
description = "Finds sales meetings that never got a follow-up and drafts one with Claude for a human to approve."
authors = [{ name = "Abdiel Otzoy" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14.0",
    "pydantic>=2.14.4",
]

[project.scripts]
follow-up-agent = "follow_up_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0"]
